{% extends "base.html" %}
{% block content %}
<div class="container glass result-card">
    <h2>Recognition Result</h2>
    <img src="{{ url_for('static', filename=img_path) }}" alt="Uploaded" class="uploaded-img">
    <p><strong>Name:</strong> {{ name }}</p>
    <p><strong>Confidence:</strong> {{ confidence }}%</p>
    <a href="{{ url_for('index') }}" class="scan-btn">Scan Another</a>
</div>
{% endblock %}
