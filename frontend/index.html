<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepFace AI | Professional Neural Recognition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #a855f7;
        --accent: #22d3ee;
        --bg: #030712;
        --text: #f8fafc;
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-border: rgba(255, 255, 255, 0.08);
        --nav-bg: rgba(3, 7, 18, 0.8);
      }

      .light-mode {
        --bg: #f8fafc;
        --text: #0f172a;
        --card-bg: rgba(255, 255, 255, 0.75);
        --card-border: rgba(0, 0, 0, 0.06);
        --nav-bg: rgba(255, 255, 255, 0.85);
        --primary: #4f46e5;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        overflow-x: hidden;
        background-color: var(--bg);
        color: var(--text);
        scroll-behavior: smooth;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--card-border);
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
      }

      .glass-nav {
        background: var(--nav-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--card-border);
      }

      .bg-mesh {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: var(--bg);
        overflow: hidden;
      }

      .light-mode .bg-mesh {
        background: radial-gradient(circle at 0% 0%, #e0e7ff 0%, #f8fafc 40%, #fae8ff 100%);
      }

      .bg-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        perspective: 1000px;
        transform: rotateX(45deg) scale(2);
        opacity: 0.3;
        animation: grid-move 20s linear infinite;
      }

      .light-mode .bg-grid {
        background-image: 
          linear-gradient(rgba(79, 70, 229, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 70, 229, 0.06) 1px, transparent 1px);
      }

      @keyframes grid-move {
        from { background-position: 0 0; }
        to { background-position: 0 1000px; }
      }

      /* Base Blob Styles */
      .bg-blob-1, .bg-blob-2, .bg-blob-3 {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        z-index: -1;
        transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Dark Mode Blobs */
      .bg-blob-1 {
        width: 800px; height: 800px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
        top: -10%; left: -10%;
        animation: blob-float-1 30s infinite alternate ease-in-out;
      }
      .bg-blob-2 {
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
        bottom: -5%; right: -5%;
        animation: blob-float-2 25s infinite alternate ease-in-out;
      }
      .bg-blob-3 {
        width: 500px; height: 500px;
        background: radial-gradient(circle, rgba(34, 211, 238, 0.08) 0%, transparent 70%);
        top: 40%; left: 30%;
        animation: blob-float-3 20s infinite alternate ease-in-out;
      }

      /* Light Mode Blob Enhancements - SUPER COLOURFUL */
      .light-mode .bg-blob-1 {
        background: radial-gradient(circle, #818cf8 0%, transparent 75%); /* Vibrant Indigo */
        opacity: 0.85;
        filter: blur(90px);
        width: 1000px; height: 1000px;
      }
      .light-mode .bg-blob-2 {
        background: radial-gradient(circle, #f472b6 0%, transparent 75%); /* Vibrant Pink */
        opacity: 0.85;
        filter: blur(80px);
        width: 800px; height: 800px;
      }
      .light-mode .bg-blob-3 {
        background: radial-gradient(circle, #22d3ee 0%, transparent 75%); /* Vibrant Cyan */
        opacity: 0.75;
        filter: blur(100px);
        width: 700px; height: 700px;
      }

      @keyframes blob-float-1 {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(15%, 10%) scale(1.15); }
      }
      @keyframes blob-float-2 {
        0% { transform: translate(0, 0) scale(1.1); }
        100% { transform: translate(-20%, -15%) scale(0.95); }
      }
      @keyframes blob-float-3 {
        0% { transform: translate(0, 0) scale(0.85); }
        100% { transform: translate(10%, -25%) scale(1.2); }
      }

      .face-mask-overlay {
        position: fixed;
        inset: 0;
        background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        opacity: 0.02;
        pointer-events: none;
        z-index: 10;
      }

      .scan-line {
        position: absolute;
        width: 100%;
        height: 4px;
        background: linear-gradient(to bottom, transparent, var(--accent), transparent);
        box-shadow: 0 0 20px var(--accent);
        animation: scan 4s linear infinite;
        z-index: 20;
      }

      @keyframes scan {
        0% { top: 0; opacity: 0; }
        5% { opacity: 0.8; }
        95% { opacity: 0.8; }
        100% { top: 100%; opacity: 0; }
      }
    </style>

{
  "imports": {

</script>

</head>

</html>
